[mypy]
python_version = 3.11
strict = false
ignore_missing_imports = false
no_implicit_optional = true

# ── Third-party packages that ship no stubs ───────────────────────────────
# These are runtime dependencies used in ml/, data/, agents/, and
# notifications/. Mypy cannot type-check them; suppress the noise so the
# signal from our own code stays visible.
[mypy-requests.*]
ignore_missing_imports = true

[mypy-pandas.*]
ignore_missing_imports = true

[mypy-yfinance.*]
ignore_missing_imports = true

[mypy-pandas_ta.*]
ignore_missing_imports = true

[mypy-joblib.*]
ignore_missing_imports = true

[mypy-sklearn.*]
ignore_missing_imports = true

[mypy-xgboost.*]
ignore_missing_imports = true

[mypy-shap.*]
ignore_missing_imports = true

[mypy-backtrader.*]
ignore_missing_imports = true

[mypy-transformers.*]
ignore_missing_imports = true

[mypy-feedparser.*]
ignore_missing_imports = true

[mypy-sentencepiece.*]
ignore_missing_imports = true

[mypy-torch.*]
ignore_missing_imports = true

[mypy-numpy.*]
ignore_missing_imports = true
